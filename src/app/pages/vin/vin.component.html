<!-- Container principal -->
<div class="min-h-screen bg-gradient-to-b from-white to-gray-50">
  <div class="container mx-auto px-4 py-4 md:py-8">
    <!-- En-tête -->
    <div
      class="flex flex-col-reverse lg:flex-row items-center justify-between gap-6"
    >
      <!-- Section de recherche -->
      <div class="w-full lg:w-1/2 space-y-4">
        <div class="space-y-2">
          <h2 class="text-2xl md:text-3xl font-light text-gray-800">
            Catégorie
            <span class="relative inline-block">
              <span
                class="absolute inset-x-0 bottom-0 h-1.5 bg-red-600 transform -skew-x-12"
              ></span>
              <span class="relative text-red-700 font-bold">Vins</span>
            </span>
          </h2>
          <p class="text-sm text-gray-600">
            Dans cette catégorie, tu pourras retrouver nos différents vins et
            autres joyeusetés !
          </p>
        </div>

        <!-- Filtres -->
        <div class="space-y-3">
          <!-- Barre de recherche -->
          <div class="relative">
            <input
              type="text"
              class="w-full px-3 py-2 rounded-full border-2 border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-all duration-300 outline-none"
              [(ngModel)]="searchValue"
              (input)="onSearchChange()"
              placeholder="Rechercher un produit..."
            />
            <span class="absolute right-4 top-1/2 transform -translate-y-1/2">
              <i class="pi pi-search text-gray-400"></i>
            </span>
          </div>

          <!-- Filtres select -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <!-- Filtre région -->
            <div class="relative">
              <select
                [(ngModel)]="selectedRegion"
                (change)="onRegionChange($event)"
                class="w-full px-3 py-2 rounded-full appearance-none border-2 border-gray-200 bg-white hover:border-red-500 transition-all duration-300 cursor-pointer"
              >
                <option value="" disabled selected>Choisir une région</option>
                <option
                  *ngFor="let region of uniqueRegions"
                  [value]="region.id"
                >
                  {{ region.name }}
                </option>
              </select>
              <div class="absolute right-4 top-1/2 transform -translate-y-1/2">
                <i class="pi pi-chevron-down text-gray-400"></i>
              </div>
            </div>

            <!-- Filtre type de vin -->
            <select
            [(ngModel)]="selectedType"
            (change)="onTypeChange($event)"
            class="w-full px-3 py-2 rounded-full appearance-none border-2 border-gray-200 bg-white hover:border-red-500 transition-all duration-300 cursor-pointer"
          >
            <option value="" disabled selected>
              Choisir un type de vin
            </option>
            <option
              *ngFor="let type of uniqueTypesFiltered"
              [value]="type.id"
            >
              {{ type.name }}
            </option>
          </select>
          </div>
          <button (click)="clearFilters()" class="p-2 w-full rounded-full bg-gray-200 text-gray-700 font-medium hover:bg-red-600 hover:text-white transition-all duration-300">
            Réinitialiser les filtres
          </button>
        </div>
      </div>

      <!-- Image banner -->
      <div class="w-full lg:w-1/4">
        <img
          src="../../../assets/1.png"
          alt="Banner vin"
          class="w-full h-32   lg:h-full object-cover max-w-[100px] lg:max-w-none mx-auto"
        />
      </div>
    </div>

    <!-- Liste des produits -->
    <section *ngIf="!isLoading" class="mt-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <div *ngFor="let item of products.slice(first, first + rows)" class="group">
          <a
            [routerLink]="'/product-overview/' + item.id"
            [state]="{ data: item }"
            class="block overflow-hidden bg-white rounded-xl shadow-md hover:shadow-lg transition-all duration-300"
          >
            <!-- ✅ Image contenue proprement -->
            <div class="aspect-[3/4] bg-gray-100 flex items-center justify-center overflow-hidden">
              <img
                [src]="item.get_image"
                loading="lazy"
                [alt]="item.name"
                class="max-h-full max-w-full object-contain transition-transform duration-500 group-hover:scale-105"
              />
            </div>
    
            <!-- ✅ Contenu de la carte -->
            <div class="p-4 space-y-3">
              <div class="flex flex-wrap gap-2">
                <span class="px-2 py-1 text-xs font-medium rounded-full bg-red-50 text-red-700">
                  {{ item.alcool_degree }}°
                </span>
                <span
                  [class]="
                    item.in_stock
                      ? 'px-2 py-1 text-xs font-medium rounded-full bg-green-50 text-green-700'
                      : 'px-2 py-1 text-xs font-medium rounded-full bg-red-50 text-red-700'
                  "
                >
                  {{ item.in_stock ? 'En stock' : 'En rupture' }}
                </span>
              </div>
    
              <h3 class="text-base font-semibold text-gray-800 line-clamp-2">
                {{ item.name }}
              </h3>
    
              <p class="text-xl font-bold text-red-600">{{ item.price }}€</p>
    
              <button
                class="w-full py-2 px-4 rounded-full bg-black text-white text-sm font-semibold transform hover:scale-105 hover:bg-red-600 transition-all duration-300"
              >
                Ajouter au panier
              </button>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Pagination -->
    <div class="mt-8">
      <p-paginator
        styleClass="custom-paginator"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="products.length"
        [rowsPerPageOptions]="[12, 24, 36]"
        [showCurrentPageReport]="true"
      ></p-paginator>
    </div>
  </div>
</div>

<!-- Spinner -->
<app-spinner *ngIf="isLoading"></app-spinner>
