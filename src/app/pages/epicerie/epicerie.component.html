<!-- Container principal -->
<div class="min-h-screen bg-gradient-to-b from-white to-gray-50">
  <div class="container mx-auto px-4 py-8 md:py-16">
    <!-- En-tête -->
    <div
      class="flex flex-col-reverse lg:flex-row items-center justify-between gap-12"
    >
      <!-- Section de recherche -->
      <div class="w-full lg:w-1/2 space-y-8">
        <div class="space-y-4">
          <h2 class="text-4xl md:text-5xl font-light text-gray-800">
            Catégorie
            <span class="relative inline-block">
              <span
                class="absolute inset-x-0 bottom-0 h-2 bg-teal-600 transform -skew-x-12"
              ></span>
              <span class="relative text-teal-700 font-bold">Épicerie</span>
            </span>
          </h2>
          <p class="text-gray-600 text-lg">
            Découvrez nos produits d'épicerie fine et autres joyeusetés !
          </p>
        </div>
        <!-- Barre de recherche -->
        <div class="relative">
          <input
            type="text"
            class="w-full px-4 py-2 rounded-full border-2 border-gray-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 transition-all duration-300 outline-none"
            [(ngModel)]="searchValue"
            (input)="onSearchChange()"
            placeholder="Rechercher un produit..."
          />
          <span class="absolute right-4 top-1/2 transform -translate-y-1/2">
            <i class="pi pi-search text-gray-400"></i>
          </span>
        </div>
      </div>

      <!-- Image banner -->
      <div class="w-full lg:w-1/4">
        <img
          src="../../../assets/4.png"
          alt="Banner épicerie"
          class="w-full h-32 lg:h-full object-cover max-w-[100px] lg:max-w-none mx-auto"
        />
      </div>
    </div>

    <!-- Liste des produits -->
    <section *ngIf="!isLoading" class="mt-16">
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        <div
          *ngFor="
            let item of products.slice(first, first + rows);
            trackBy: trackByProductId
          "
          class="group"
        >
          <a
            [routerLink]="'/product-overview/' + item.id"
            [state]="{ data: item }"
            class="block overflow-hidden bg-white rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300"
          >
            <div class="relative h-72">
              <img
                [src]="item.get_image"
                [alt]="item.name"
                class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
              />
            </div>

            <div class="p-6 space-y-4">
              <div class="flex flex-wrap gap-2">
                <span
                  class="px-3 py-1 text-sm font-medium rounded-full bg-teal-50 text-teal-700"
                >
                  {{ item.alcool_degree }}°
                </span>
                <span
                  [class]="
                    item.in_stock
                      ? 'px-3 py-1 text-sm font-medium rounded-full bg-green-50 text-green-700'
                      : 'px-3 py-1 text-sm font-medium rounded-full bg-red-50 text-red-700'
                  "
                >
                  {{ item.in_stock ? "En stock" : "En rupture" }}
                </span>
              </div>

              <h3 class="text-lg font-semibold text-gray-800 line-clamp-2">
                {{ item.name }}
              </h3>

              <p class="text-2xl font-bold text-teal-600">{{ item.price }}€</p>

              <button
                class="w-full py-3 px-6 rounded-full bg-black text-white font-semibold transform hover:scale-105 hover:bg-teal-600 transition-all duration-300"
              >
                Ajouter au panier
              </button>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Pagination -->
    <div class="mt-12">
      <p-paginator
        styleClass="custom-paginator"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="products.length"
        [rowsPerPageOptions]="[12, 24, 36]"
        [showCurrentPageReport]="true"
      ></p-paginator>
    </div>
  </div>
</div>

<!-- Spinner -->
<app-spinner *ngIf="isLoading"></app-spinner>
