<section class="px-4 md:px-10 lg:px-20">
  <div class="flex flex-col md:flex-row mt-10 space-y-10 md:space-y-0">
    <!-- Image Section -->
    <div class="p-4 md:p-10 w-full md:w-1/2 flex justify-center">
      <img
        class="border-8 border-black max-h-64 sm:max-h-80 md:max-h-96 lg:max-h-full object-contain rounded-3xl"
        [src]="receivedData?.get_image"
        alt="Produit"
      />
    </div>

    <!-- Details Section -->
    <div class="p-4 md:p-10 flex flex-col w-full md:w-1/2">
      <!-- Tags -->
      <div class="space-x-2 flex flex-wrap mb-4">
        <span
          class="whitespace-nowrap rounded-lg text-teal-700 font-bold bg-teal-200 px-3 py-1.5 text-xs"
        >
          {{ receivedData?.alcool_degree }} degrés
        </span>
        <span
          *ngIf="receivedData?.in_stock"
          class="whitespace-nowrap rounded-lg bg-green-100 font-bold text-green-700 px-3 py-1.5 text-xs"
        >
          En stock
        </span>
        <span
          *ngIf="!receivedData?.in_stock"
          class="whitespace-nowrap rounded-lg bg-red-100 font-bold text-red-700 px-3 py-1.5 text-xs"
        >
          En rupture
        </span>
      </div>

      <!-- Product Name -->
      <h1
        class="mt-2 font-bold text-lg sm:text-xl md:text-2xl text-center md:text-left"
      >
        <span class="highlight highlight-black text-white">
          {{ receivedData?.name }}
        </span>
      </h1>

      <!-- Description Section -->
      <div
        class="mt-6 flex flex-col items-center md:flex-row md:items-start md:space-x-6"
      >
        <img
          class="h-20 sm:h-24 md:h-40 lg:h-52 object-contain"
          src="./assets/deelar.png"
          alt="Logo"
        />
        <p
          *ngIf="receivedData?.description"
          class="mt-4 md:mt-0 text-sm sm:text-base md:text-lg font-light text-center md:text-left"
        >
          {{ receivedData?.description }}
        </p>
        <p
          *ngIf="!receivedData?.description"
          class="mt-4 md:mt-0 text-sm sm:text-base md:text-lg font-light text-center md:text-left"
        >
          Toutes nos excuses mais nous n'avons pas de description pour ce
          produit ! N'hésitez pas à nous appeler pour avoir plus d'informations
          !
        </p>
      </div>

      <!-- Price -->
      <p class="mt-8 font-bold text-base sm:text-lg md:text-xl">
        Prix : {{ receivedData?.price }} €
      </p>

      <!-- Add to Cart Button -->
      <button
        (click)="showToast()"
        class="
          rounded-full
          mt-8
          w-full border-4 border-black bg-white text-black font-bold p-2 sm:p-3 md:p-4
          transition hover:scale-105 hover:bg-black hover:text-white duration-200
        "
      >
        Ajouter au panier
      </button>
      <p-toast position="top-right"></p-toast>
    </div>
  </div>
</section>
